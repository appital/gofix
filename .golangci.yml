version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - dupl
    - godot
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    dupl:
      threshold: 400
    staticcheck:
      checks:
        - all
        # Defaults disabled by golangci-lint.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Removing embedded fields from selectors often hurts readability.
        - -QF1008
  exclusions:
    generated: lax
    # Matches the default exclusions applied by golangci-lint v1.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen
      - vendor

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - gen
      - vendor
