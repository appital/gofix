name: Tests
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: Temporarily stripped down to a single build + unit test job while the
# library is in flux and CI minutes are limited. The previous acceptance test
# suites can be restored from git history.
jobs:
  test:
    name: Build & Unit Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    env:
      # Use the toolchain installed by setup-go rather than letting the go
      # directive in go.mod download a different one.
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # Resolve to the latest patch release rather than whatever is cached
          # on the runner, which may be older than the go directive in go.mod.
          check-latest: true
      - name: Build
        run: make build-src
      - name: Vet
        run: make vet
      - name: Unit test (non-db)
        run: make test-ci-nodb
